[package]
name = "config-sync"
version = "0.2.1"
edition = "2021"
description = "config sync across machines through one central repo: shared base + per-machine overlay"
license = "MIT"

[[bin]]
name = "cfgsync"
path = "src/main.rs"

[dependencies]
serde_json = { version = "1", features = ["preserve_order"] }

[profile.release]
strip = true
lto = true
